<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >


    <title>StoryForge</title>
    <link rel="icon" type="image/png" href="/src/images/flavicon.png">

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Google Fonts -->
    <!-- Cinzel for headings and StoryForge branding -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap"
        rel="stylesheet"
    >

    <!--
        StoryForge CSS comes AFTER Bootstrap so our custom
        styles can override Bootstrap where necessary.
    -->
    <link
        rel="stylesheet"
        href="/src/styles/styles.css"
    >
</head>

<body>

    <div id="app"></div>

    <!-- StoryForge JavaScript -->
    <script
        type="module"
        src="/src/js/app.js"
    ></script>

    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
    ></script>

</body>

</html>
